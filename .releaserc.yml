branches:
  - name: main
    channel: latest

plugins:
  - - "@semantic-release/commit-analyzer"
    - preset: conventionalcommits
      parserOpts:
        noteKeywords:
          - BREAKING CHANGE
          - BREAKING CHANGES

  - - "@semantic-release/release-notes-generator"
    - preset: conventionalcommits
      types:
        - type: feat
          section: "Features"
        - type: fix
          section: "Bug Fixes"
        - type: perf
          section: "Performance"
        - type: revert
          section: "Reverts"

  - - "@semantic-release/changelog"
    - changelogFile: docs/CHANGELOG.md

  - - "@semantic-release/npm"
    - npmPublish: false

  - - "@semantic-release/git"
    - assets:
        - docs/CHANGELOG.md
        - package.json
        - package-lock.json
      message: "chore(release): ${nextRelease.version} [skip ci]\n\n${nextRelease.notes}"
